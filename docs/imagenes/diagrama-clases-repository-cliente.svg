<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 40px Arial, sans-serif; fill: #123a66; }
      .subtitle { font: 700 27px Arial, sans-serif; fill: #222; }
      .head { font: 700 25px Arial, sans-serif; fill: #fff; }
      .stereo { font: italic 19px Arial, sans-serif; fill: #fff; }
      .body { font: 21px Arial, sans-serif; fill: #17212b; }
      .label { font: 700 19px Arial, sans-serif; fill: #0b7a35; }
      .box { fill: #fff; stroke: #123a66; stroke-width: 3; }
      .box-head { fill: #124f82; }
      .divider { stroke: #123a66; stroke-width: 2; }
      .relation { fill: none; stroke: #16863e; stroke-width: 5; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#16863e"/>
    </marker>
    <marker id="triangle" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#fff" stroke="#16863e" stroke-width="2"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="1584" height="884" rx="8" fill="#fff" stroke="#16863e" stroke-width="5"/>
  <text x="800" y="62" text-anchor="middle" class="title">DIAGRAMA DE CLASES – PATRÓN REPOSITORY</text>
  <text x="800" y="102" text-anchor="middle" class="subtitle">Módulo Cliente – AGRIHUSA</text>

  <!-- ClienteController -->
  <rect x="40" y="180" width="350" height="270" rx="8" class="box"/>
  <path d="M48 180 H382 Q390 180 390 188 V250 H40 V188 Q40 180 48 180" class="box-head"/>
  <text x="215" y="222" text-anchor="middle" class="head">ClienteController</text>
  <line x1="40" y1="250" x2="390" y2="250" class="divider"/>
  <text x="58" y="287" class="body">− clienteService: ClienteService</text>
  <line x1="40" y1="310" x2="390" y2="310" class="divider"/>
  <text x="58" y="350" class="body">+ listar()</text>
  <text x="58" y="388" class="body">+ registrar()</text>
  <text x="58" y="426" class="body">+ cambiarEstado()</text>

  <!-- ClienteService -->
  <rect x="510" y="160" width="380" height="290" rx="8" class="box"/>
  <path d="M518 160 H882 Q890 160 890 168 V250 H510 V168 Q510 160 518 160" class="box-head"/>
  <text x="700" y="192" text-anchor="middle" class="stereo">«interface»</text>
  <text x="700" y="225" text-anchor="middle" class="head">ClienteService</text>
  <line x1="510" y1="250" x2="890" y2="250" class="divider"/>
  <text x="530" y="300" class="body">+ listarClientes()</text>
  <text x="530" y="350" class="body">+ registrar()</text>
  <text x="530" y="400" class="body">+ cambiarEstado()</text>

  <!-- ClienteServiceImpl -->
  <rect x="510" y="570" width="380" height="270" rx="8" class="box"/>
  <path d="M518 570 H882 Q890 570 890 578 V640 H510 V578 Q510 570 518 570" class="box-head"/>
  <text x="700" y="612" text-anchor="middle" class="head">ClienteServiceImpl</text>
  <line x1="510" y1="640" x2="890" y2="640" class="divider"/>
  <text x="528" y="679" class="body">− clienteRepository: ClienteRepository</text>
  <line x1="510" y1="700" x2="890" y2="700" class="divider"/>
  <text x="528" y="738" class="body">+ listarClientes()</text>
  <text x="528" y="778" class="body">+ registrar()</text>
  <text x="528" y="818" class="body">+ cambiarEstado()</text>

  <!-- ClienteRepository -->
  <rect x="1070" y="160" width="450" height="290" rx="8" class="box"/>
  <path d="M1078 160 H1512 Q1520 160 1520 168 V260 H1070 V168 Q1070 160 1078 160" class="box-head"/>
  <text x="1295" y="192" text-anchor="middle" class="stereo">«interface»</text>
  <text x="1295" y="224" text-anchor="middle" class="head">ClienteRepository</text>
  <text x="1295" y="250" text-anchor="middle" class="stereo">extends JpaRepository</text>
  <line x1="1070" y1="260" x2="1520" y2="260" class="divider"/>
  <text x="1090" y="310" class="body">+ listarClientes()</text>
  <text x="1090" y="360" class="body">+ save()</text>
  <text x="1090" y="410" class="body">+ findById()</text>

  <!-- ClienteEntity -->
  <rect x="1070" y="570" width="450" height="270" rx="8" class="box"/>
  <path d="M1078 570 H1512 Q1520 570 1520 578 V640 H1070 V578 Q1070 570 1078 570" class="box-head"/>
  <text x="1295" y="612" text-anchor="middle" class="head">ClienteEntity</text>
  <line x1="1070" y1="640" x2="1520" y2="640" class="divider"/>
  <text x="1090" y="680" class="body">− clienteId: Integer</text>
  <text x="1090" y="716" class="body">− tipoDocumento: String</text>
  <text x="1090" y="752" class="body">− numeroDocumento: String</text>
  <text x="1090" y="788" class="body">− razonSocial: String</text>
  <text x="1090" y="824" class="body">− activo: Boolean</text>

  <!-- Relaciones -->
  <path d="M390 300 H510" class="relation" marker-end="url(#arrow)"/>
  <text x="450" y="286" text-anchor="middle" class="label">utiliza</text>

  <path d="M700 570 V450" class="relation" stroke-dasharray="12 10" marker-end="url(#triangle)"/>
  <text x="716" y="520" class="label">implementa</text>

  <path d="M890 680 H970 V330 H1070" class="relation" marker-end="url(#arrow)"/>
  <text x="980" y="316" class="label">utiliza</text>

  <path d="M1295 450 V570" class="relation" marker-end="url(#arrow)"/>
  <text x="1314" y="520" class="label">gestiona</text>
</svg>
