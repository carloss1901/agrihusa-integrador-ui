<div class="modal-header">
  <div>
    <p class="modal-eyebrow mb-1">
      Gestión logística
    </p>

    <h5 class="modal-title">
      {{ titleModal }}
    </h5>
  </div>

  <button
    type="button"
    class="btn-close"
    aria-label="Cerrar"
    title="Cerrar"
    (click)="onCerrarModal()"
  ></button>
</div>

<div class="modal-body">
  <form
    id="formularioPuertoLlegada"
    [formGroup]="formulario"
    (ngSubmit)="onGuardar()"
  >
    <section class="form-section">
      <h6 class="form-section-title">
        Identificación del puerto
      </h6>

      <div class="row gx-3">
        <div class="col-12 col-md-4">
          <div class="form-group mb-3 mb-md-0">
            <label
              class="form-label"
              for="codigoPuerto"
            >
              Código:
              <span class="text-danger">*</span>
            </label>

            <input
              id="codigoPuerto"
              type="text"
              class="form-control text-uppercase"
              formControlName="codigo"
              maxlength="10"
              autocomplete="off"
              placeholder="Ejemplo: PECLL"
              [class.is-invalid]="
                controlInvalido('codigo')
              "
            />

            <div
              *ngIf="controlInvalido('codigo')"
              class="invalid-feedback"
            >
              Ingresa entre 3 y 10 letras, números o
              guiones.
            </div>
          </div>
        </div>

        <div class="col-12 col-md-8">
          <div class="form-group mb-3 mb-md-0">
            <label
              class="form-label"
              for="nombrePuerto"
            >
              Puerto:
              <span class="text-danger">*</span>
            </label>

            <input
              id="nombrePuerto"
              type="text"
              class="form-control text-uppercase"
              formControlName="puerto"
              maxlength="100"
              autocomplete="off"
              placeholder="Ejemplo: CALLAO"
              [class.is-invalid]="
                controlInvalido('puerto')
              "
            />

            <div
              *ngIf="controlInvalido('puerto')"
              class="invalid-feedback"
            >
              Ingresa un nombre válido de máximo
              100 caracteres.
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 mt-3">
          <div class="form-group">
            <label
              class="form-label"
              for="paisPuerto"
            >
              País:
              <span class="text-danger">*</span>
            </label>

            <input
              id="paisPuerto"
              type="text"
              class="form-control text-uppercase"
              formControlName="pais"
              maxlength="80"
              autocomplete="off"
              placeholder="Ejemplo: PERÚ"
              [class.is-invalid]="
                controlInvalido('pais')
              "
            />

            <div
              *ngIf="controlInvalido('pais')"
              class="invalid-feedback"
            >
              Ingresa un país válido de máximo
              80 caracteres.
            </div>
          </div>
        </div>
      </div>
    </section>
  </form>
</div>

<div class="modal-footer">
  <agrihusa-button
    texto="Cancelar"
    color="danger"
    icon="x"
    (click)="onCerrarModal()"
  ></agrihusa-button>

  <agrihusa-button
    texto="Guardar"
    icon="check"
    (click)="onGuardar()"
  ></agrihusa-button>
</div>
