<div class="contenedor d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg login-card">
    <div class="card-body">
      <h3 class="text-center mb-4 login-title">Login</h3>
      <form>
        <div class="container-fluid px-0">
          <div class="row gx-3 align-items-baseline mb-2">
            <div class="col-12">
              <div class="form-group">
                <label for="username" class="font-weight-bold">Usuario:</label>
                <input
                  id="username"
                  type="text"
                  class="form-control"
                  placeholder="Ingrese su usuario"
                  value="demo"
                />
              </div>
            </div>
            <div class="col-12">
              <div class="form-group">
                <label for="password" class="font-weight-bold">Contrasena:</label>
                <input
                  id="password"
                  type="password"
                  class="form-control"
                  placeholder="Ingrese su contrasena"
                  value="demo"
                />
              </div>
            </div>
          </div>

          <div class="row gx-3 align-items-baseline mb-2">
            <div class="col-12">
              <button class="w-100 btn btn-success" type="button" (click)="iniciarSesion()">
                Iniciar sesion
              </button>
            </div>
          </div>

          <div class="text-center mt-3">
            <a href="javascript:void(0)" class="text-decoration-none login-link">
              Olvidaste tu contrasena? <span>Recuperala aqui</span>
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
