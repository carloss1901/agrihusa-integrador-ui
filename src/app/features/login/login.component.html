<div class="
    contenedor
    d-flex
    justify-content-center
    align-items-center
    vh-100
  ">
  <div class="card shadow-lg login-card">
    <div class="card-body">
      <h3 class="text-center login-title">
        AGROINDUSTRIAS HUARAL S.A.C
      </h3>

      <p class="text-center text-muted mb-4">
        Acceso al sistema de despacho
      </p>

      <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
        <div class="container-fluid px-0">
          <div class="mb-3">
            <label for="username" class="form-label fw-bold">
              Usuario:
            </label>

            <input id="username" type="text" class="form-control" placeholder="Ingrese su usuario"
              autocomplete="username" formControlName="nombreUsuario" [class.is-invalid]="
                controlInvalido('nombreUsuario')
              " />

            <div class="invalid-feedback">
              El usuario es obligatorio.
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-bold">
              Contraseña:
            </label>

            <input id="password" type="password" class="form-control" placeholder="Ingrese su contraseña"
              autocomplete="current-password" formControlName="password" [class.is-invalid]="
                controlInvalido('password')
              " />

            <div class="invalid-feedback">
              La contraseña es obligatoria.
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger py-2" role="alert">
            {{ errorMessage }}
          </div>

          <button class="w-100 btn btn-success" type="submit" [disabled]="loading">
            {{
            loading
            ? 'Validando...'
            : 'Iniciar sesión'
            }}
          </button>

          <div class="login-demo mt-3">
            <span>Acceso local</span>
            <strong>ADMIN / Admin123*</strong>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
