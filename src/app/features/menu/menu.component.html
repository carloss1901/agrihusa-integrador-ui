<aside class="agrihusa-sidebar" id="agrihusa-aside-menu">
  <div>
    <div class="d-flex justify-content-between align-items-center content-header-menu">
      <span class="text-white mb-0">MENU</span>
      <span
        (click)="toggleMenu(true)"
        class="menu-collapse-icon text-white"
      >
        ‹
      </span>
    </div>
  </div>

  <div class="menu-group" *ngFor="let menuItem of menuArrAgrihusa">
    <div
      class="accordion-button"
      role="button"
      tabindex="0"
      [attr.aria-expanded]="estaGrupoAbierto(menuItem.codigo)"
      (click)="alternarGrupo(menuItem.codigo)"
      (keydown.enter)="alternarGrupo(menuItem.codigo)"
      (keydown.space)="$event.preventDefault(); alternarGrupo(menuItem.codigo)"
    >
      <span>{{ menuItem.nombreModulo | uppercase }}</span>
      <svg
        class="accordion-chevron"
        [class.expanded]="estaGrupoAbierto(menuItem.codigo)"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
    <div class="accordion-body" *ngIf="estaGrupoAbierto(menuItem.codigo)">
      <ul>
        <li
          *ngFor="let subItem of menuItem.subMenu"
          [class.active]="subItem.codigo === menuSeleccionadoId"
          (click)="onClickMenu(subItem)"
        >
          <span>{{ subItem.nombre }}</span>
        </li>
      </ul>
    </div>
  </div>
</aside>
