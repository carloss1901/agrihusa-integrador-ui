<div class="frame-layout">
  <div class="frame-layout__header">
    <div class="col-12 my-2">
      <agrihusa-topbar [titulo]="titulo" subtitulo="Registro histórico de eventos del sistema"
        [showCancel]="false"></agrihusa-topbar>
    </div>
  </div>

  <div class="frame-layout__body">
    <div class="agrihusa-card mb-component">
      <app-filtro-auditoria (buscar)="onBuscar($event)" (limpiar)="onLimpiar()"></app-filtro-auditoria>
    </div>

    <div class="agrihusa-card">
      <div class="
          p-content
          d-flex
          justify-content-between
          align-items-center
        ">
        <div>
          <span class="title-group-uppercase">
            Registros de bitácora
          </span>

          <p class="mb-0 text-muted small">
            Los eventos son de solo lectura y no pueden
            modificarse ni eliminarse.
          </p>
        </div>

        <div class="d-flex gap-2">
          <div title="Exportar resultados a CSV">
            <agrihusa-button color="primary" variant="outlined" icon="download" [esIcono]="true" [disabled]="
        !puedeExportar ||
        !totalItems
      " (click)="exportarCsv()"></agrihusa-button>
          </div>

          <div title="Ver detalle del registro">
            <agrihusa-button color="secondary" variant="outlined" icon="eye" [esIcono]="true"
              [disabled]="!filaSeleccionada" (click)="mostrarModalDetalle()"></agrihusa-button>
          </div>
        </div>
      </div>

      <app-tabla-auditoria [datasource]="registros" [loading]="loading" [totalItems]="totalItems" [page]="page"
        [pageSize]="pageSize" [filaSeleccionada]="filaSeleccionada" (seleccionar)="onSeleccionarItem($event)"
        (paginar)="onChangePaginate($event)"></app-tabla-auditoria>
    </div>
  </div>
</div>
