<div class="agrihusa">
  <div class="modal-header">
    <div>
      <p class="mb-1 text-success fw-bold small">
        Registro histórico inmutable
      </p>

      <h5 class="modal-title">
        {{ titleModal }}
      </h5>
    </div>

    <button type="button" class="btn-close" aria-label="Cerrar" title="Cerrar" (click)="onCerrar()"></button>
  </div>

  <div class="modal-body">
    <div class="modal-body-content">
      <div class="container-fluid px-0">
        <div class="row gx-3">
          <div class="col-12 col-md-4">
            <div class="form-group mb-3">
              <label class="form-label" for="bitacoraDetalleId">
                Id:
              </label>

              <input id="bitacoraDetalleId" class="form-control" [value]="data?.id ?? ''" readonly />
            </div>
          </div>

          <div class="col-12 col-md-8">
            <div class="form-group mb-3">
              <label class="form-label" for="bitacoraDetalleFecha">
                Fecha y hora:
              </label>

              <input id="bitacoraDetalleFecha" class="form-control" [value]="formatearFecha(data?.fecha)" readonly />
            </div>
          </div>

          <div class="col-12 col-md-6">
            <div class="form-group mb-3">
              <label class="form-label" for="bitacoraDetalleUsuario">
                Usuario:
              </label>

              <input id="bitacoraDetalleUsuario" class="form-control" [value]="data?.nombreUsuario ?? ''" readonly />
            </div>
          </div>

          <div class="col-12 col-md-6">
            <div class="form-group mb-3">
              <label class="form-label" for="bitacoraDetalleUsuarioId">
                Id de usuario:
              </label>

              <input id="bitacoraDetalleUsuarioId" class="form-control" [value]="
                  data?.usuarioId ?? 'NO DISPONIBLE'
                " readonly />
            </div>
          </div>

          <div class="col-12 col-md-6">
            <div class="form-group mb-3">
              <label class="form-label" for="bitacoraDetalleAccion">
                Acción:
              </label>

              <input id="bitacoraDetalleAccion" class="form-control" [value]="
                  obtenerNombreAccion(data?.accion)
                " readonly />
            </div>
          </div>

          <div class="col-12 col-md-6">
            <div class="form-group mb-3">
              <label class="form-label" for="bitacoraDetalleModulo">
                Módulo:
              </label>

              <input id="bitacoraDetalleModulo" class="form-control" [value]="
                  obtenerNombreModulo(data?.modulo)
                " readonly />
            </div>
          </div>

          <div class="col-12 col-md-6">
            <div class="form-group mb-3">
              <label class="form-label" for="bitacoraDetalleEntidad">
                Entidad:
              </label>

              <input id="bitacoraDetalleEntidad" class="form-control" [value]="data?.entidad ?? ''" readonly />
            </div>
          </div>

          <div class="col-12 col-md-6">
            <div class="form-group mb-3">
              <label class="form-label" for="bitacoraDetalleRegistroId">
                Id del registro afectado:
              </label>

              <input id="bitacoraDetalleRegistroId" class="form-control" [value]="
                  data?.registroId ?? 'NO APLICA'
                " readonly />
            </div>
          </div>

          <div class="col-12">
            <div class="form-group mb-3">
              <label class="form-label" for="bitacoraDetalleResultado">
                Resultado:
              </label>

              <input id="bitacoraDetalleResultado" class="form-control text-uppercase fw-bold"
                [value]="data?.resultado ?? ''" readonly />
            </div>
          </div>

          <div class="col-12">
            <div class="form-group">
              <label class="form-label" for="bitacoraDetalleDescripcion">
                Detalle:
              </label>

              <textarea id="bitacoraDetalleDescripcion" class="form-control" rows="4" [value]="data?.detalle ?? ''"
                readonly></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <agrihusa-button texto="Cerrar" color="secondary" icon="x" (click)="onCerrar()"></agrihusa-button>
  </div>
</div>
