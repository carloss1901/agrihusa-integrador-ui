<div class="modal-header">
  <div>
    <p class="modal-eyebrow mb-1">
      Gestión logística
    </p>

    <h5 class="modal-title">
      {{ titleModal }}
    </h5>
  </div>

  <button
    type="button"
    class="btn-close"
    aria-label="Cerrar"
    title="Cerrar"
    (click)="onCerrarModal()"
  ></button>
</div>

<div class="modal-body">
  <form
    id="formularioVia"
    [formGroup]="formulario"
    (ngSubmit)="onGuardar()"
  >
    <section class="form-section">
      <h6 class="form-section-title">
        Información de la vía
      </h6>

      <div class="row gx-3">
        <div class="col-12">
          <div class="form-group">
            <label
              class="form-label"
              for="descripcionVia"
            >
              Vía:
              <span class="text-danger">*</span>
            </label>

            <input
              id="descripcionVia"
              type="text"
              class="form-control text-uppercase"
              formControlName="descripcion"
              maxlength="80"
              autocomplete="off"
              placeholder="Ejemplo: MARÍTIMA"
              [class.is-invalid]="
                controlInvalido('descripcion')
              "
            />

            <div
              *ngIf="controlInvalido('descripcion')"
              class="invalid-feedback"
            >
              Ingresa una vía válida de entre 3 y
              80 caracteres.
            </div>
          </div>
        </div>
      </div>
    </section>
  </form>
</div>

<div class="modal-footer">
  <agrihusa-button
    texto="Cancelar"
    color="danger"
    icon="x"
    (click)="onCerrarModal()"
  ></agrihusa-button>

  <agrihusa-button
    texto="Guardar"
    icon="check"
    (click)="onGuardar()"
  ></agrihusa-button>
</div>
