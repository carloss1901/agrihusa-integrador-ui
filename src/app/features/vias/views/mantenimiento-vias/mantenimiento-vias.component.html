<div class="frame-layout">
  <div class="frame-layout__header">
    <div class="col-12 my-2">
      <agrihusa-topbar [titulo]="getNombreMantenimiento" [subtitulo]="'Mantenimiento de vias'" [showCancel]="false"></agrihusa-topbar>
    </div>
  </div>

  <div class="frame-layout__body">
    <div class="agrihusa-card mb-component">
      <app-filtro-mant-vias (buscarVia)="onBuscar($event)" (limpiar)="onLimpiarFiltro()"></app-filtro-mant-vias>
    </div>

    <div class="agrihusa-card">
      <div class="p-content d-flex justify-content-between align-items-center">
        <span class="title-group-uppercase">Lista de vias</span>
        <div class="d-flex gap-2">
          <agrihusa-button color="primary" variant="outlined" icon="plus" [esIcono]="true" (click)="mostrarModalUpsert(AccionMantenimiento.CREAR)"></agrihusa-button>
          <agrihusa-button color="secondary" variant="outlined" icon="edit" [esIcono]="true" [disabled]="!filaSeleccionada || !filaSeleccionada.activo" (click)="mostrarModalUpsert(AccionMantenimiento.ACTUALIZAR)"></agrihusa-button>
          <agrihusa-button color="secondary" variant="outlined" icon="trash" [esIcono]="true" [disabled]="!filaSeleccionada" (click)="eliminarVia()"></agrihusa-button>
        </div>
      </div>

      <app-tabla-mant-vias
        [datasource]="dataVias"
        [loading]="loading"
        [totalItems]="totalItems"
        [page]="page"
        [pageSize]="pageSize"
        [filaSeleccionada]="filaSeleccionada"
        (seleccionar)="onSeleccionarItem($event)"
        (paginar)="onChangePaginate($event)"
      ></app-tabla-mant-vias>
    </div>
  </div>
</div>
