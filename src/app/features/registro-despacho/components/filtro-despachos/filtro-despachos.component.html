<div ngbAccordion [closeOthers]="false">
  <div ngbAccordionItem [collapsed]="false">
    <h2 ngbAccordionHeader>
      <button
        ngbAccordionButton
        class="d-flex justify-content-between w-100"
        type="button"
      >
        <span class="title-group-uppercase">
          Filtros de búsqueda
        </span>
      </button>
    </h2>

    <div ngbAccordionCollapse>
      <div ngbAccordionBody>
        <ng-template>
          <form [formGroup]="formulario">
            <div class="container-fluid px-0">
              <div class="row gx-3">
                <div class="col-12 col-lg-4">
                  <div class="form-group">
                    <label
                      class="form-label"
                      for="filtroDespachoTexto"
                    >
                      Despacho:
                    </label>

                    <input
                      id="filtroDespachoTexto"
                      class="form-control text-uppercase"
                      type="search"
                      formControlName="texto"
                      placeholder="Código o contenedor"
                      autocomplete="off"
                      (keyup.enter)="onBuscar()"
                    />
                  </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                  <div class="form-group">
                    <label
                      class="form-label"
                      for="filtroDespachoFechaDesde"
                    >
                      Fecha desde:
                    </label>

                    <input
                      id="filtroDespachoFechaDesde"
                      class="form-control"
                      type="date"
                      formControlName="fechaDesde"
                    />
                  </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                  <div class="form-group">
                    <label
                      class="form-label"
                      for="filtroDespachoFechaHasta"
                    >
                      Fecha hasta:
                    </label>

                    <input
                      id="filtroDespachoFechaHasta"
                      class="form-control"
                      type="date"
                      formControlName="fechaHasta"
                    />
                  </div>
                </div>
              </div>

              <div class="row gx-3 mt-2">
                <div class="col-12 col-md-6 col-xl-3">
                  <div class="form-group">
                    <label
                      class="form-label"
                      for="filtroDespachoCliente"
                    >
                      Cliente:
                    </label>

                    <ng-select
                      inputId="filtroDespachoCliente"
                      [items]="clientes"
                      bindLabel="razonSocial"
                      bindValue="id"
                      placeholder="-- SELECCIONAR --"
                      [clearable]="true"
                      [searchable]="true"
                      formControlName="clienteId"
                    ></ng-select>
                  </div>
                </div>

                <div class="col-12 col-md-6 col-xl-3">
                  <div class="form-group">
                    <label
                      class="form-label"
                      for="filtroDespachoProducto"
                    >
                      Producto:
                    </label>

                    <ng-select
                      inputId="filtroDespachoProducto"
                      [items]="productos"
                      bindLabel="nombre"
                      bindValue="id"
                      placeholder="-- SELECCIONAR --"
                      [clearable]="true"
                      [searchable]="true"
                      formControlName="productoId"
                    ></ng-select>
                  </div>
                </div>

                <div class="col-12 col-md-6 col-xl-3">
                  <div class="form-group">
                    <label
                      class="form-label"
                      for="filtroDespachoSituacion"
                    >
                      Situación:
                    </label>

                    <ng-select
                      inputId="filtroDespachoSituacion"
                      [items]="situaciones"
                      bindLabel="descripcion"
                      bindValue="id"
                      placeholder="-- SELECCIONAR --"
                      [clearable]="true"
                      [searchable]="true"
                      formControlName="situacionId"
                    ></ng-select>
                  </div>
                </div>

                <div class="col-12 col-md-6 col-xl-3">
                  <div class="form-group">
                    <label
                      class="form-label"
                      for="filtroDespachoEstado"
                    >
                      Estado:
                    </label>

                    <ng-select
                      inputId="filtroDespachoEstado"
                      class="text-uppercase"
                      [items]="estados"
                      bindLabel="descripcion"
                      bindValue="valor"
                      placeholder="-- SELECCIONAR --"
                      [clearable]="true"
                      [searchable]="false"
                      formControlName="estado"
                    ></ng-select>
                  </div>
                </div>
              </div>

              <div
                class="
                  row
                  gx-2
                  justify-content-end
                  mt-3
                "
              >
                <div class="col-auto">
                  <div class="d-flex gap-2">
                    <agrihusa-button
                      texto="Limpiar"
                      icon="refresh-ccw"
                      color="secondary"
                      (click)="onLimpiar()"
                    ></agrihusa-button>

                    <agrihusa-button
                      texto="Buscar"
                      icon="search"
                      (click)="onBuscar()"
                    ></agrihusa-button>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </ng-template>
      </div>
    </div>
  </div>
</div>
