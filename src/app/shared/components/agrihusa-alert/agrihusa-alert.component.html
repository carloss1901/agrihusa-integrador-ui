@if (alertService.toasts.length) {
  <div class="toast__animation pt-4">
    @for (toast of alertService.toasts; track toast) {
      <ngb-toast [class]="toast.classname" [autohide]="true" [delay]="toast.delay || 5000"
        (hidden)="alertService.remove(toast)">
        <div class="alert alert-flotante" role="alert">
          <span class="feather" [class]="getIcon(toast.classname)"></span>
          <div class="w-100 mx-3 d-flex flex-column">
            <span class="label-large siaf-grey-30">{{ toast.message }}</span>
            @if (toast.errores?.length) {
              <div>
                @for (error of toast.errores; track error) {
                  <span class="label-large siaf-grey-30 d-block mt-1">
                    {{ error.campo }}: {{ error.mensaje }}
                  </span>
                }
              </div>
            }
          </div>
          <button type="button" class="btn-close-toast ms-auto" aria-label="Cerrar"
            (click)="alertService.remove(toast)">
            <i class="feather icon-x"></i>
          </button>
        </div>
      </ngb-toast>
    }
  </div>
}
